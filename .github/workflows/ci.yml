# Pull-request gate: lint + tests + dependency audits + LLDAP integration.
# No images are pushed by this workflow.

name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend — lint, tests, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest
      - run: pip install pip-audit && pip-audit -r requirements.txt

  bot:
    name: Bot — lint, tests, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest
      - run: pip install pip-audit && pip-audit -r requirements.txt

  frontend:
    name: Frontend — lint, tests, build, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - name: Validate nginx config syntax
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq nginx-light
          echo "127.0.0.1 backend" | sudo tee -a /etc/hosts >/dev/null
          printf 'pid /tmp/nginx.pid;\nerror_log /tmp/nginx-error.log;\nevents {}\nhttp {\n  access_log /tmp/nginx-access.log;\n  include %s/nginx.conf;\n}\n' "$PWD" > /tmp/nginx-wrapper.conf
          sudo nginx -t -c /tmp/nginx-wrapper.conf

  integration:
    name: Integration — real LLDAP container
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      lldap:
        image: lldap/lldap:stable
        env:
          LLDAP_LDAP_USER: admin
          LLDAP_LDAP_USER_PASS: integration-test-password
          LLDAP_LDAP_BASE_DN: dc=example,dc=com
        ports:
          - 3890:3890
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
        # Give the service a moment to finish booting before the suite runs.
      - run: sleep 10
      - run: pytest tests/integration
        env:
          INTEGRATION_LLDAP_URL: ldap://localhost:3890
          INTEGRATION_ADMIN_DN: uid=admin,ou=people,dc=example,dc=com
          INTEGRATION_ADMIN_PASSWORD: integration-test-password
          INTEGRATION_BASE_DN: dc=example,dc=com
