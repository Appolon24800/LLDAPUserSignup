# Release pipeline: on push to main and on v* tags.
# A lint+test gate must pass first; images are only pushed when it is green.

name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  gate:
    name: Gate — lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            bot/requirements-dev.txt
      - name: Backend checks
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          ruff check .
          pytest
      - name: Bot checks
        working-directory: bot
        run: |
          pip install -r requirements-dev.txt
          ruff check .
          pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
      - name: Validate nginx config syntax
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq nginx-light
          echo "127.0.0.1 backend" | sudo tee -a /etc/hosts >/dev/null
          printf 'pid /tmp/nginx.pid;\nerror_log /tmp/nginx-error.log;\nevents {}\nhttp {\n  access_log /tmp/nginx-access.log;\n  include %s/nginx.conf;\n}\n' "$PWD/frontend" > /tmp/nginx-wrapper.conf
          sudo nginx -t -c /tmp/nginx-wrapper.conf

  integration:
    name: Gate — LLDAP integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      lldap:
        image: lldap/lldap:stable
        env:
          LLDAP_LDAP_USER: admin
          LLDAP_LDAP_USER_PASS: integration-test-password
          LLDAP_JWT_SECRET: ci-only-value-not-a-secret-0123456789abcdef
          LLDAP_LDAP_BASE_DN: dc=example,dc=com
        ports:
          - 3890:3890
          - 17170:17170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: sleep 10
      - run: pytest tests/integration
        env:
          INTEGRATION_LLDAP_URL: ldap://localhost:3890
          INTEGRATION_ADMIN_DN: uid=admin,ou=people,dc=example,dc=com
          INTEGRATION_ADMIN_PASSWORD: integration-test-password
          INTEGRATION_BASE_DN: dc=example,dc=com
          INTEGRATION_LLDAP_HTTP_URL: http://localhost:17170

  build-and-push:
    name: Build and push ${{ matrix.component }}
    needs: [gate, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [backend, bot, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Compute lowercase image name
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lldapusersignup-${{ matrix.component }}" >> "$GITHUB_OUTPUT"
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
