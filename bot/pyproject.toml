[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "S",   # flake8-bandit (security)
    "RUF", # ruff-specific
]
ignore = [
    "S104", # 0.0.0.0 binding is legitimate inside containers
    "RUF029", # async detection false-positives on ptb handlers
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101", # asserts are the point of tests
    "S106", # hardcoded dummy tokens in fixtures
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
