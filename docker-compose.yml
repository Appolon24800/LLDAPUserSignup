# Self-hosted LLDAP signup stack. LLDAP itself is NOT bundled — point LDAP_URL
# at your existing instance. All values come from .env (see .env.example).
#
#   docker compose up -d
#
# Put a TLS-terminating reverse proxy (Caddy/Traefik/nginx) in front of
# `frontend`; Flask and this stack never do TLS themselves.

name: lldap-signup

services:
  backend:
    build: ./backend
    image: ghcr.io/appolon24800/lldapusersignup-backend:latest
    restart: unless-stopped
    # No ports published: only the frontend (and the bot, on the internal
    # network) talk to the backend.
    expose:
      - "8000"
    environment:
      BASE_URL: ${BASE_URL}
      LDAP_URL: ${LDAP_URL}
      LDAP_ADMIN_DN: ${LDAP_ADMIN_DN}
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD}
      LDAP_BASE_DN: ${LDAP_BASE_DN}
      LDAP_ALLOW_INSECURE: ${LDAP_ALLOW_INSECURE:-false}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      CODE_EXPIRY_MINUTES: ${CODE_EXPIRY_MINUTES:-60}
      MAX_FAILED_ATTEMPTS: ${MAX_FAILED_ATTEMPTS:-5}
      RATE_LIMIT_VALIDATE: ${RATE_LIMIT_VALIDATE:-20 per minute}
      RATE_LIMIT_SUBMIT: ${RATE_LIMIT_SUBMIT:-5 per minute}
      DATABASE_PATH: /data/codes.db
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-2}
    volumes:
      - signup-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    image: ghcr.io/appolon24800/lldapusersignup-frontend:latest
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

  bot:
    build: ./bot
    image: ghcr.io/appolon24800/lldapusersignup-bot:latest
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ADMIN_IDS: ${TELEGRAM_ADMIN_IDS}
      BACKEND_URL: http://backend:8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  signup-data:
