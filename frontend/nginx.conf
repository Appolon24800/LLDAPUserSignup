# Static SPA + reverse proxy for the backend API.
# TLS is terminated by an external reverse proxy (Caddy/Traefik) in front of
# this container — nginx here speaks plain HTTP on the internal network only.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Slightly above the backend's MAX_UPLOAD_MB cap so 413s come from the
    # backend (with proper JSON error bodies), not from nginx HTML pages.
    client_max_body_size 3m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # API proxy: one trusted hop, so the backend's ProxyFix(x_for=1) resolves
    # the real client IP for rate limiting.
    location /api/v1/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Also proxy /healthz for orchestrators that probe through the frontend.
    location = /healthz {
        proxy_pass http://backend:8000/healthz;
        access_log off;
    }

    # SPA fallback: /register?code=... must serve index.html.
    location / {
        try_files $uri /index.html;
    }

    # Never advertise server internals.
    server_tokens off;
}
